<nav class="navbar navbar-expand-lg bg-white border-bottom">
  <div class="container-fluid px-3">
    <a class="logo navbar-brand" routerLink="/panel">
      <span class="cursiva">Hermanas</span>
      <span class="mayus">EMPRENDEDORAS</span>
    </a>
    <button class="navbar-toggler" type="button" aria-label="Abrir menú"
            [attr.aria-expanded]="menuAbierto()" (click)="menuAbierto.set(!menuAbierto())">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" [class.show]="menuAbierto()">
      <ul class="navbar-nav ms-auto">
        @for (link of links; track link.ruta) {
          <li class="nav-item">
            <a class="nav-link" [routerLink]="link.ruta" routerLinkActive="active"
               [routerLinkActiveOptions]="{ exact: link.exacto }" (click)="menuAbierto.set(false)">
              {{ link.texto }}
            </a>
          </li>
        }
        <li class="nav-item">
          <a class="nav-link text-muted" routerLink="/" target="_blank">Ver catálogo ↗</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container-fluid px-3 py-3">
  <router-outlet />
</main>
